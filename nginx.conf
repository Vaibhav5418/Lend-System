# Nginx Configuration for Loanly / Lend System on AWS EC2
# Place this file or copy its content to: /etc/nginx/sites-available/default
# or /etc/nginx/sites-available/lendflow (and symlink to /etc/nginx/sites-enabled/)

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain (e.g., loanly.yourdomain.com) if you have one

    # Match the backend's 15 MB document limit plus 1 MB multipart overhead.
    client_max_body_size 16M;

    # Gzip Compression for fast page loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

    # 1. Frontend: Serve React Vite Static Build
    location / {
        root /var/www/lend-system/Lend-project/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache static assets (images, js, css)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Backend: Reverse Proxy for API requests to Express server (Port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for AI processing and large document uploads (8 minutes)
        proxy_connect_timeout 480s;
        proxy_send_timeout 480s;
        proxy_read_timeout 480s;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
