
name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── 1. Build and Validation Check ───────────────────────
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            Lend-project/package-lock.json
            Lend-server/package-lock.json

      - name: Validate Frontend Build
        working-directory: ./Lend-project
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Validate Backend Dependencies
        working-directory: ./Lend-server
        run: |
          npm ci --ignore-scripts

  # ─── 2. Deploy to EC2 via SSH ───────────────────────────
  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ─── 3. Test GitHub Runner to EC2 Connectivity ──────
      - name: Debug EC2 SSH Connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "======================================"
          echo " GitHub Runner Network Diagnostics"
          echo "======================================"

          echo "GitHub Runner Public IP:"
          curl -s --max-time 15 https://api.ipify.org
          echo ""

          echo "--------------------------------------"
          echo "Testing EC2 SSH connectivity..."
          echo "Target: $EC2_HOST"
          echo "Port: 22"
          echo "--------------------------------------"

          python3 - <<'PY'
          import os
          import socket
          import sys

          host = os.environ["EC2_HOST"]

          try:
              print(f"Resolving host: {host}")
              ip = socket.gethostbyname(host)
              print(f"Resolved IP: {ip}")

              print("Connecting to EC2 on port 22...")

              sock = socket.create_connection(
                  (host, 22),
                  timeout=20
              )

              print("SUCCESS: EC2 SSH port 22 is reachable!")
              sock.close()

          except socket.timeout:
              print("FAILED: Connection timed out.")
              sys.exit(1)

          except OSError as error:
              print(f"FAILED: {error}")
              sys.exit(1)
          PY

          echo "======================================"
          echo " Connectivity test completed"
          echo "======================================"

      # ─── 4. Deploy on EC2 ──────────────────────────────
      - name: Deploy on AWS EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            echo "🚀 Starting deployment on EC2..."

            # Navigate to project directory
            cd /var/www/lend-system

            # Pull latest changes from main branch
            echo "📥 Pulling latest code..."
            git reset --hard HEAD
            git pull origin main

            # Backend Setup
            echo "⚙️ Updating backend..."
            cd /var/www/lend-system/Lend-server
            npm ci --omit=dev --ignore-scripts

            # Restart or Start Backend with PM2
            if pm2 describe lend-server > /dev/null 2>&1; then
              echo "🔄 Reloading PM2 backend..."
              pm2 reload lend-server --update-env
            elif pm2 describe lend-backend > /dev/null 2>&1; then
              echo "🔄 Reloading PM2 backend..."
              pm2 reload lend-backend --update-env
            else
              echo "▶️ Starting PM2 backend..."
              pm2 start server.js --name lend-server
            fi

            pm2 save

            # Frontend Setup & Build
            echo "🎨 Building frontend..."
            cd /var/www/lend-system/Lend-project
            npm ci --ignore-scripts
            npm run build

            # Update Nginx config and permissions
            echo "🌐 Updating Nginx..."
            cd /var/www/lend-system

            if [ -f "nginx.conf" ]; then
              sudo cp nginx.conf /etc/nginx/sites-available/default
              sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
            fi

            sudo chmod -R 755 /var/www/lend-system
            sudo nginx -t
            sudo systemctl reload nginx

            echo "✅ Deployment completed successfully!"
